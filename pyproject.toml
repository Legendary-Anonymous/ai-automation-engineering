[project]
name = "ai-automation-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Legendary-Anonymous", email = "vanapallisukumar96@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cloudscraper>=1.2.71",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2.24",
    "langsmith>=0.15.1",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "playwright>=1.65.2",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "supabase>=2.34.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-automation-engineering = "ai_automation_engineering:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
